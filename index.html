<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Milemarkers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0f0f11; --surface: #1a1a1f; --surface2: #222228;
      --border: #2e2e38; --text: #e8e8ed; --text-dim: #7a7a8a;
      --accent: #7c6af7; --accent-dim: rgba(124,106,247,0.15);
      --blue: #60a5fa; --green: #4ade80; --amber: #fbbf24;
    }
    body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; min-height: 100vh; }
    header { position: sticky; top: 0; z-index: 100; background: rgba(15,15,17,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 32px; height: 56px; display: flex; align-items: center; justify-content: space-between; }
    .logo { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .logo-mark { width: 28px; height: 28px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 14px; }
    .project-badge { font-size: 12px; color: var(--text-dim); background: var(--surface2); border: 1px solid var(--border); padding: 4px 10px; border-radius: 20px; }
    .container { max-width: 720px; margin: 0 auto; padding: 48px 24px 120px; }
    .page-title { margin-bottom: 40px; }
    .page-title h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.03em; margin-bottom: 6px; }
    .page-title p { color: var(--text-dim); font-size: 14px; }
    .stats { display: flex; gap: 24px; margin-bottom: 40px; padding: 16px 20px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-value { font-size: 20px; font-weight: 700; letter-spacing: -0.03em; }
    .stat-label { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat-divider { width: 1px; background: var(--border); }
    .timeline { position: relative; }
    .timeline::before { content: ''; position: absolute; left: 19px; top: 0; bottom: 0; width: 1px; background: var(--border); }
    .milestone { position: relative; padding-left: 56px; margin-bottom: 4px; }
    .milestone-dot { position: absolute; left: 10px; top: 18px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); border: 2px solid var(--border); display: flex; align-items: center; justify-content: center; z-index: 1; }
    .milestone.flagged .milestone-dot { background: var(--accent-dim); border-color: var(--accent); }
    .milestone-dot-inner { width: 6px; height: 6px; border-radius: 50%; background: var(--text-dim); }
    .milestone.flagged .milestone-dot-inner { background: var(--accent); }
    .milestone-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; margin-bottom: 8px; transition: all 0.15s; }
    .milestone-card:hover { border-color: #3e3e50; background: var(--surface2); }
    .milestone.flagged .milestone-card { border-color: rgba(124,106,247,0.3); }
    .milestone-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
    .milestone-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
    .milestone-meta { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
    .milestone-date { font-size: 11px; color: var(--text-dim); }
    .type-badge { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.04em; }
    .type-conversation { background: rgba(96,165,250,0.15); color: var(--blue); }
    .type-code { background: rgba(74,222,128,0.15); color: var(--green); }
    .type-design { background: rgba(251,191,36,0.15); color: var(--amber); }
    .milestone-summary { font-size: 13px; color: var(--text-dim); line-height: 1.6; }
    .milestone-tags { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .tag { font-size: 11px; color: var(--text-dim); background: rgba(255,255,255,0.04); border: 1px solid var(--border); padding: 2px 8px; border-radius: 4px; }
    .month-divider { padding-left: 56px; margin-bottom: 20px; margin-top: 12px; }
    .month-label { font-size: 11px; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.08em; }
    .add-btn { position: fixed; bottom: 32px; right: 32px; background: var(--accent); color: white; border: none; border-radius: 12px; padding: 12px 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; box-shadow: 0 4px 20px rgba(124,106,247,0.4); transition: all 0.15s; }
    .add-btn:hover { transform: translateY(-1px); }

    /* Modal */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 24px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 20px 24px 0; display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-size: 16px; font-weight: 600; letter-spacing: -0.02em; }
    .modal-close { background: none; border: none; color: var(--text-dim); font-size: 20px; cursor: pointer; padding: 4px; line-height: 1; }
    .modal-close:hover { color: var(--text); }
    .modal-body { padding: 20px 24px; display: flex; flex-direction: column; gap: 16px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 12px; font-weight: 500; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
    .field input, .field textarea, .field select {
      background: var(--surface2); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text); font-size: 13px; padding: 10px 12px; outline: none;
      font-family: inherit; transition: border-color 0.15s;
    }
    .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); }
    .field textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
    .field select option { background: var(--surface2); }
    .flag-toggle { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .flag-toggle input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); cursor: pointer; }
    .flag-toggle span { font-size: 13px; color: var(--text-dim); }
    .modal-footer { padding: 0 24px 20px; display: flex; flex-direction: column; gap: 12px; }
    .btn-primary { background: var(--accent); color: white; border: none; border-radius: 8px; padding: 11px 20px; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .btn-primary:hover { opacity: 0.9; }

    /* JSON export box */
    .json-box { display: none; margin-top: 4px; }
    .json-box.visible { display: block; }
    .json-label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
    .json-label span { color: var(--amber); }
    .json-content { background: #0a0a0c; border: 1px solid var(--border); border-radius: 8px; padding: 12px; font-family: 'Menlo', 'Monaco', monospace; font-size: 11px; color: var(--green); line-height: 1.6; white-space: pre-wrap; word-break: break-all; }
    .copy-btn { margin-top: 8px; background: none; border: 1px solid var(--border); color: var(--text-dim); border-radius: 6px; padding: 6px 12px; font-size: 11px; cursor: pointer; transition: all 0.15s; }
    .copy-btn:hover { border-color: var(--text-dim); color: var(--text); }
  </style>
</head>
<body>

<header>
  <div class="logo"><div class="logo-mark">⬡</div> Milemarkers</div>
  <span class="project-badge">milemarkers</span>
</header>

<div class="container">
  <div class="page-title">
    <h1>Iteration Log</h1>
    <p>A visual record of how your work has evolved.</p>
  </div>
  <div class="stats" id="stats"></div>
  <div class="timeline" id="timeline"></div>
</div>

<button class="add-btn" onclick="openModal()">+ Add Milestone</button>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="handleOverlayClick(event)">
  <div class="modal">
    <div class="modal-header">
      <h2>New Milestone</h2>
      <button class="modal-close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>Title</label>
        <input type="text" id="f-title" placeholder="What happened or was decided?">
      </div>
      <div class="field">
        <label>Summary</label>
        <textarea id="f-summary" placeholder="Describe this moment in a sentence or two..."></textarea>
      </div>
      <div class="field">
        <label>Type</label>
        <select id="f-type">
          <option value="conversation">Conversation</option>
          <option value="code">Code</option>
          <option value="design">Design</option>
        </select>
      </div>
      <div class="field">
        <label>Tags <span style="font-size:10px;text-transform:none;letter-spacing:0">(comma separated)</span></label>
        <input type="text" id="f-tags" placeholder="e.g. planning, fork, dead-end">
      </div>
      <label class="flag-toggle">
        <input type="checkbox" id="f-flagged">
        <span>🚩 Flag as important milestone</span>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-primary" onclick="addMilestone()">Add to Timeline</button>
      <div class="json-box" id="jsonBox">
        <p class="json-label">✓ Added! <span>Copy this into your milestones.json to save it permanently:</span></p>
        <div class="json-content" id="jsonContent"></div>
        <button class="copy-btn" onclick="copyJSON()">Copy JSON</button>
      </div>
    </div>
  </div>
</div>

<script>
  const data = {
    project: "milemarkers",
    milestones: [
      {
        id: "001",
        date: "2026-02-27",
        title: "Project kickoff",
        type: "conversation",
        tags: ["planning", "milestone"],
        summary: "Initial conversation defining the concept for Milemarkers—a visual iteration log for AI workflows. Decided on vertical feed layout, manual milestone flagging, and GitHub as the source of truth.",
        flagged: true
      }
    ]
  };

  function formatDate(d) {
    return new Date(d+'T00:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  }

  function today() {
    return new Date().toISOString().split('T')[0];
  }

  function renderStats() {
    const m = data.milestones;
    document.getElementById('stats').innerHTML = `
      <div class="stat"><span class="stat-value">${m.length}</span><span class="stat-label">Milestones</span></div>
      <div class="stat-divider"></div>
      <div class="stat"><span class="stat-value">${m.filter(x=>x.flagged).length}</span><span class="stat-label">Flagged</span></div>
      <div class="stat-divider"></div>
      <div class="stat"><span class="stat-value">${[...new Set(m.map(x=>x.type))].length}</span><span class="stat-label">Types</span></div>`;
  }

  function renderTimeline() {
    const sorted = [...data.milestones].sort((a,b)=>new Date(b.date)-new Date(a.date));
    const groups = {};
    sorted.forEach(m => {
      const key = new Date(m.date+'T00:00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
      if (!groups[key]) groups[key] = [];
      groups[key].push(m);
    });
    let html = '';
    for (const [month, items] of Object.entries(groups)) {
      html += `<div class="month-divider"><span class="month-label">${month}</span></div>`;
      items.forEach(m => {
        html += `
          <div class="milestone ${m.flagged?'flagged':''}">
            <div class="milestone-dot"><div class="milestone-dot-inner"></div></div>
            <div class="milestone-card">
              <div class="milestone-header
